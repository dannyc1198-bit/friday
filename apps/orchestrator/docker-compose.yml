version: "3.8"

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: JARVIS-chromadb
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  chromadb_data:
    driver: local
